name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "signal-dach/**"
  pull_request:
    branches: [main]
    paths:
      - "signal-dach/**"

defaults:
  run:
    working-directory: signal-dach

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Backend: Lint + Type Check + Test
  # -----------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: signal-dach/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app/ tests/ --output-format github

      - name: Format check (ruff)
        run: ruff format app/ tests/ --check

      - name: Run tests
        run: pytest tests/ -x -q --tb=short
        env:
          SIGNALDACH_AUTH_ENABLED: "false"
          SIGNALDACH_LOG_LEVEL: WARNING

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r app/ -ll -ii --skip B101 -f json -o bandit-report.json || true
          bandit -r app/ -ll -ii --skip B101 || true
        continue-on-error: true

  # -----------------------------------------------------------------------
  # Frontend: Lint + Type Check + Build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: signal-dach/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: signal-dach/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx next lint
        continue-on-error: true

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001

      - name: Run tests
        run: npx vitest run --reporter=verbose 2>/dev/null || echo "No test files found yet — skipping"
        continue-on-error: true

  # -----------------------------------------------------------------------
  # E2E: Playwright (PRs only)
  # -----------------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: signal-dach/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signal-dach/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: signal-dach/frontend/playwright-report/
          retention-days: 7

  # -----------------------------------------------------------------------
  # Security: dependency audit
  # -----------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r signal-dach/backend/pyproject.toml 2>/dev/null || true
        continue-on-error: true

      - name: npm audit
        run: |
          cd signal-dach/frontend
          npm audit --production 2>/dev/null || true
        continue-on-error: true

  # -----------------------------------------------------------------------
  # Docker build test
  # -----------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t signaldach-backend signal-dach/backend/

      - name: Build frontend image
        run: |
          if [ -f signal-dach/frontend/Dockerfile ]; then
            docker build -t signaldach-frontend signal-dach/frontend/
          else
            echo "No frontend Dockerfile — skipping"
          fi
