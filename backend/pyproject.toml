[project]
name = "signal-dach-backend"
version = "0.1.0"
description = "Market Intelligence & Regulatory Tracker for Crypto Funds (DACH)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "asyncpraw>=7.7.0",
    "tweepy>=4.14.0",
    "apscheduler>=3.10.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",
    "openai>=1.50.0",
    "resend>=2.0.0",
    "PyJWT>=2.8.0",
    "redis[hiredis]>=5.0.0",
    "anthropic>=0.39.0",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentencepiece>=0.2.0",
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
